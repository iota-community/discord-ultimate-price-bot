
version: '3.4'

services:
  ultimatepricebot:
    image: ultimatepricebot
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "2"
    restart: always
    build:
      context: .
      dockerfile: src/ICCD.UltimatePriceBot.App/Dockerfile
    environment:
      - APP_ENVIRONMENT=Production
